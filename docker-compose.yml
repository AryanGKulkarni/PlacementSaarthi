# Shared by backend + ingestion-worker (same image, same config)
x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-placement}:${POSTGRES_PASSWORD:-placement}@postgres:5432/${POSTGRES_DB:-placement_db}
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-placement}:${RABBITMQ_PASSWORD:-placement}@rabbitmq:5672/
  CHROMA_HOST: chromadb
  CHROMA_PORT: "8000"
  OLLAMA_URL: http://ollama:11434
  MODEL: llama3.2:3b
  EMBED_MODEL: nomic-embed-text
  DATA_DIR: /app/data                 # uploads/, models/
  HF_HOME: /root/.cache/huggingface
  WATCHFILES_FORCE_POLLING: "true"    # file-change events don't cross Windows bind mounts

x-backend-volumes: &backend-volumes
  - ./backend/app:/app/app            # live code mount (dev)
  - appdata:/app/data                 # persists ChromaDB + uploads
  - hf_cache:/root/.cache/huggingface # embedding model, downloaded once

services:
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    image: placement-backend:latest
    build: ./backend
    # Dev: auto-reload on code changes (code is mounted from ./backend/app)
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app
    ports:
      - "8000:8000"
    environment:
      <<: *backend-env
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    volumes: *backend-volumes
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      chromadb:
        condition: service_started
      ollama:
        condition: service_started

  ingestion-worker:
    image: placement-backend:latest     # same image as backend (built by the backend service)
    # Dev: restart the worker on code changes
    command: watchfiles --filter python --target-type command "python -m app.workers.ingestion_worker" /app/app
    environment: *backend-env
    volumes: *backend-volumes
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started      # backend builds the image + creates the DB schema
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      chromadb:
        condition: service_started

  chromadb:
    image: chromadb/chroma:1.5.9        # keep in sync with the chromadb client version
    environment:
      ANONYMIZED_TELEMETRY: "FALSE"
    ports:
      - "8001:8000"                     # host 8001 (8000 is the backend); API: http://localhost:8001/api/v2/heartbeat
    volumes:
      - chromadata:/data                # vectors + metadata persist here

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    hostname: rabbitmq                  # RabbitMQ stores data per hostname; keep it fixed
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-placement}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-placement}
    ports:
      - "5672:5672"                     # AMQP (for running backend/worker locally)
      - "15672:15672"                   # management UI: http://localhost:15672
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-placement}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-placement}
      - POSTGRES_DB=${POSTGRES_DB:-placement_db}
    ports:
      - "5432:5432"                     # for local dev / DB tools (pgAdmin, DBeaver)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    ports:
      - "8080:8080"                     # DB viewer: http://localhost:8080
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    depends_on:
      - postgres

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  appdata:
  hf_cache:
  pgdata:
  rabbitmq:
  chromadata:
  ollama:
