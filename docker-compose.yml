services:
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_URL=http://ollama:11434
      - MODEL=llama3.2:3b
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      - DATA_DIR=/app/data            # sqlite db, chroma/, uploads/
      - HF_HOME=/root/.cache/huggingface
    volumes:
      - appdata:/app/data             # persists SQLite + ChromaDB + uploads
      - hf_cache:/root/.cache/huggingface  # embedding model, downloaded once
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  appdata:
  hf_cache:
  ollama:
